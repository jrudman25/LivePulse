apiVersion: v1
kind: ConfigMap
metadata:
  name: livepulse-backend-config
  namespace: livepulse
data:
  APP_ENV: "development"
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
  WS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livepulse-backend
  namespace: livepulse
  labels:
    app.kubernetes.io/name: livepulse-backend
spec:
  replicas: 1
  # The current backend keeps its WebSocket hubs and aggregation state in memory.
  # Recreate avoids overlapping old and new processes during local image updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: livepulse-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livepulse-backend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: livepulse-backend:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: livepulse-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: livepulse-local-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: livepulse-local-secrets
                  key: REDIS_URL
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: livepulse-local-secrets
                  key: CLERK_SECRET_KEY
                  optional: true
            # Omit this Secret key on the first run to prevent the startup fetch.
            - name: EXTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: livepulse-local-secrets
                  key: EXTERNAL_API_KEY
                  optional: true
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: livepulse-local-secrets
                  key: ADMIN_API_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: livepulse-backend
  namespace: livepulse
  labels:
    app.kubernetes.io/name: livepulse-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: livepulse-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
